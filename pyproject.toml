[project]
name = "wechat-mcp-publisher"
version = "0.1.0"
description = "微信公众号草稿发布本地 MCP 工具（FastMCP + stdio）"
readme = "README.md"
authors = [
    { name = "yongle", email = "yonglelaoren@163.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.2",
]
